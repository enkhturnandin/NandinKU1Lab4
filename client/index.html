<!DOCTYPE html>
<html>
<head>
  <title>auth system nandin ku-1</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>authentication system</h1>

    <input
      type="text"
      id="username"
      placeholder="Username"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <div class="buttons">
      <button onclick="registerUser()">
        Register
      </button>

      <button onclick="loginUser()">
        Login
      </button>
    </div>

    <p id="message"></p>

  </div>

  <script src="script.js"></script>

</body>
</html>
